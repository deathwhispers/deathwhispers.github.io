# Name of your site (displayed in the header)
name: "death whisper"
# Short bio or description (displayed in the header)
description: " 个人学习 | 日常记录 | 留档 "

# 这里的地址:1.使用相对路径，但是不要用./images形式，必须从根目录/images/这样，不然在首页显示而文章页不显示，因为不在同一层级目录
# 2. 直接使用一个可访问的链接，比如使用 github 访问链接。
# URL of your avatar or profile pic (you could use your GitHub profile pic)
avatar: /images/avatar.png
#avatar: https://raw.githubusercontent.com/deathwhispers/deathwhispers.github.io/main/images/avatar.png
# 你的favicon（出现在浏览器tab上）图片URL，建议使用较小(64px × 64px)的图片
favicon: /images/favicon.ico
#favicon: https://raw.githubusercontent.com/deathwhispers/deathwhispers.github.io/main/images/favicon.ico

# Tabs in header. There are 'Blog', 'About', 'Archive', 'Tags'
# and URL Link(e.g. 'Theme' tab below) tabs. If you don't need one, just delete
# it from the list(Delete '- name: ' and 'url: ', too!)
navigation:
  - name: 首页
    url: /
  - name: 归档
    url: /archive
  - name: 标签
    url: /tags
  - name: 导航
    url: /guide

defaults:
  - scope:
      path: "_posts"
    values:
      layout: "post"  # 确保博客文章仍用 post 布局

# Pagination
paginate: 10
mathjax: true
excerpt_separator: <!-- more -->

# Includes an icon in the footer for each username you enter
# 链接仅需要填写 username 即可，网站地址在 svg-icons.html 中已经定义了

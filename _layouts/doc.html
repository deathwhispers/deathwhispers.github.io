---
layout: default  # 继承你博客的主布局（现有配置中的 default.html）
---

<!-- 文档标题 -->
<div class="doc-header" style="margin: 2rem 0; padding-bottom: 1rem; border-bottom: 1px solid #eee;">
    <h1 style="font-size: 2rem; font-weight: 600;">{{ page.title | default: "文档手册" }}</h1>
</div>

<!-- 左侧目录 + 右侧内容（响应式布局） -->
<div style="display: flex; flex-wrap: wrap; gap: 2rem; margin: 2rem 0;">
    <!-- 左侧目录（依赖 jekyll-toc 插件） -->
    {% if page.toc %}
    <div style="flex: 0 0 250px; max-width: 250px;">
        <div style="position: sticky; top: 2rem; padding: 1rem; border-radius: 4px; background: #f9f9f9;">
            <h3 style="margin-top: 0; font-size: 1.2rem;">文档目录</h3>
            {{ content | toc_only }}  <!-- 只显示目录，不重复内容 -->
        </div>
    </div>
    {% endif %}

    <!-- 右侧文档内容 -->
    <div style="flex: 1; min-width: 300px;">
        <div class="doc-content" style="line-height: 1.8; font-size: 1rem;">
            {{ content | toc_remove }}  <!-- 显示内容，移除目录（避免重复） -->
        </div>

        <!-- 文档页面的 Gitalk 评论（如果启用了 gitalk: true） -->
        {% if page.gitalk and site.gitalk %}
        <div style="margin-top: 3rem; padding-top: 2rem; border-top: 1px solid #eee;">
            {% include gitalk.html %}  <!-- 复用你现有博客的 gitalk 组件 -->
        </div>
        {% endif %}
    </div>
</div>

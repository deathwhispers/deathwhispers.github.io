name: Notion To Blog

on:
  schedule:
    - cron: "30 0 /1 * *"  # 每12小时检查一次更新
  workflow_dispatch: true # 允许手动触发


jobs:
  notion-to-blog:
    if: ${{ github.event.issue.user.login == github.actor && contains(github.event.issue.title, 'notion-ci') }}
    runs-on: ubuntu-latest

    steps:
      - name: checkout code
        uses: actions/checkout@v2
        with:
          # Workflows are only triggered when commits (and tags I think, but it would need to be tested) are created pushed using a Personal Access Token (PAT).
          # ref: https://github.com/EndBug/add-and-commit/issues/311#issuecomment-948749635
          token: ${{ secrets.CHECKOUT_TOKEN }}

      - name: Markdown From Notion
        uses: deathwhispers/deathwhispers.github.io@master
        with:
          # notion申请的app的api token
          notion_token: ${{ secrets.NOTION_TOKEN }}
          # notion中需要作为博客发布的database的id，这是一个uuid，可以通过Share->Copy link获取，
          # 注意需要把其中的id转化为uuid的格式，比如 Copy link出来为 https://www.notion.so/akkuman/7bf568e946b946189b2b4af0c61b9e78?v=c45b5e45e96541f4bf81994ab4af1a6e，
          # 则notion_database_id为 7bf568e9-46b9-4618-9b2b-4af0c61b9e78，并且你所要发布的文章以及该database都需要invite我们上面申请的app（为了token能够获取到内容）
          notion_database_id: ${{ secrets.NOTION_DATABASE_ID }}
          # notion中提取出来的图片保存到哪，可选 local 或者 github，默认为 local
          # local代表保存到源仓库，
          # github代表保存到另一个github仓库（图床）中
          img_store_type: local
          # 图片保存的路径前缀，默认为 static/notionimg
          img_store_path_prefix: images
          # 当 img_store_type=local 时需要，设置在markdown图片链接中的前缀，
          # 和上面的 img_store_path_prefix 不相同，比如 img_store_path_prefix='static/notionimg' img_store_url_path_prefix：='/notionimg/' 的情况下，
          # 则图片保存路径为 './static/notionimg/{img_md5}{img_ext}', 而在markdown文件中的体现为 ![](/notionimg/{img_md5}{img_ext})
          img_store_url_path_prefix: ${{ secrets.IMG_STORE_URL_PATH_PREFIX }}
          # Actions run as an user, but when they are running in a fork there are potential security problems, so they are degraded to "read-only"
          # ref: https://github.com/actions/first-interaction/issues/10#issuecomment-546628432
          # ref: https://docs.github.com/en/actions/security-guides/automatic-token-authentication#permissions-for-the-github_token
          # so you should set another token

          # 当 img_store_type=github 时需要，设置保存图片到github图床所使用的token（secrets.GITHUB_TOKEN 只有读权限，所以需要另外使用）
          img_store_github_token: ${{ secrets.CHECKOUT_TOKEN }}
          # 当 img_store_type=github 时需要，你把哪个仓库当作github图床
          img_store_github_repo: deathwhispers/pic
          # 当 img_store_type=github 时需要，你把哪个github图床仓库的哪一个分支当作图床
          img_store_github_branch: master
          # 最后生成的markdown文件保存在哪，默认是当前仓库目录的 content/posts 目录下
          md_store_path_prefix: ${{ secrets.MD_STORE_PATH_PREFIX }}

      - name: push to github
        uses: EndBug/add-and-commit@v7
        with:
          branch: hugo
          message: 'Notion CI'



https://www:
  notion:
    so/deathwhispers/1fb37f6c8b0280c2a577f4fb4ed0208e?v=1fb37f6c8b0280089c8f000c555ba166&pvs=4:
#---------------------------------------------------#
## 配置文件需要放置在 $HOME/.config/clash/*.yaml

## 这份文件是clashX的基础配置文件，请尽量新建配置文件进行修改。
## 端口设置请在 菜单条图标->配置->更多配置 中进行修改

## 如果您不知道如何操作，请参阅 官方Github文档 https://dreamacro.github.io/clash/
#---------------------------------------------------#

#---------------------------------------------------#
## 自定义Clash配置
## 作者： Colin Chang
## 更新：2023-04-13 
#---------------------------------------------------#


mixed-port: 7890
allow-lan: false
mode: Rule
log-level: error
system-proxy: false
external-controller: 127.0.0.1:9090

proxy-providers:
  FlyingBird-HongKong:
    type: http
    path: ./ProxySet/FlyingBird/HongKong.yaml
    url: "https://ww5271.xyz/rss/cv1/285yyUJ/Eb8CUr"
    interval: 1800
    filter: 'HK'
    health-check:
      enable: true
      url: http://www.gstatic.com/generate_204
      interval: 300
  FlyingBird-TaiWan:

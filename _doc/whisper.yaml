    interval: 1800
    filter: ''
    health-check:
      enable: true
      url: http://www.gstatic.com/generate_204
      interval: 300

proxy-groups:
  - name: 境外流量
    type: url-test
    url: http://www.gstatic.com/generate_204
    interval: 300
    use:
      - FlyingBird-All
  - name: Youtube
    type: url-test
    url: http://www.gstatic.com/generate_204
    interval: 300
    proxies:
      - 流媒体
  - name: Xiaohongshu
    type: url-test
    url: http://www.gstatic.com/generate_204
    interval: 300
    use:
      - FlyingBird-Xiaohongshu
  - name: Netflix
    type: url-test
    url: http://www.gstatic.com/generate_204
    interval: 300
    proxies:
      - 流媒体
  - name: Telegram
    type: url-test
    url: http://www.gstatic.com/generate_204
    interval: 300
    proxies:
      - 境外流量
  - name: Apple
    type: url-test
    url: http://www.gstatic.com/generate_204
    interval: 300
    proxies:
      - DIRECT
      - 境外流量
  - name: 流媒体
    type: url-test
    url: http://www.gstatic.com/generate_204
    interval: 300
    use:
      - FlyingBird-Media
      - FlyingBird-Netflix
    filter: "JP|US|TW"
  - name: ChatGPT
    type: url-test
    url: http://www.gstatic.com/generate_204
    interval: 300
    use:
      - FlyingBird-ChatGPT
    filter: "JP"
  - name: JP
    type: url-test
    url: http://www.gstatic.com/generate_204
    interval: 300
    use:
      - FlyingBird-Japan


---
layout: default
title: 网址导航
permalink: /guide/
icon: fa-link
---

<style>
    .link-nav {
        max-width: 1200px;
        margin: 2rem auto;
        padding: 2rem;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    .link-nav h1 {
        text-align: center;
        font-size: 2.5rem;
        font-weight: 700;
        color: #2c3e50;
        margin-bottom: 1rem;
        background: linear-gradient(90deg, #5468ff, #46d1ff);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
    }

    .link-nav .subtitle {
        text-align: center;
        color: #7f8c8d;
        font-size: 1.1rem;
        margin-bottom: 3rem;
    }

    .link-category {
        margin-bottom: 3rem;
    }

    .link-category-header {
        display: flex;
        align-items: center;
        gap: 0.75rem;
        margin-bottom: 1.5rem;
        padding-bottom: 0.75rem;
        border-bottom: 2px solid #f0f0f0;
    }

    .link-category-header i {
        font-size: 1.5rem;
        color: #3498db;
    }

    .link-category-header h2 {
        font-size: 1.5rem;
        font-weight: 600;
        color: #2c3e50;
        margin: 0;
    }

    .link-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
        gap: 1.5rem;
    }

    .link-card {
        background: #ffffff;
        border: 1px solid #eaeaea;
        border-radius: 12px;
        padding: 1.25rem;
        transition: all 0.3s ease;
        box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        position: relative;
        overflow: hidden;
    }

    .link-card:hover {
        transform: translateY(-5px);
        box-shadow: 0 10px 25px rgba(0,0,0,0.1);
        border-color: #d1e7ff;
    }

    .link-card::before {
        content: '';
        position: absolute;
        top: 0;
        left: 0;
        width: 4px;
        height: 0%;
        background: linear-gradient(to bottom, #5468ff, #46d1ff);
        transition: height 0.3s ease;
    }

    .link-card:hover::before {
        height: 100%;
    }

    .link-card a {
        text-decoration: none;
        color: inherit;
        display: block;
        height: 100%;
    }

    .link-card-header {
        display: flex;
        align-items: center;
        gap: 0.75rem;
        margin-bottom: 0.75rem;
    }

    .link-card-header i {
        font-size: 1.25rem;
        color: #3498db;
        min-width: 24px;
        text-align: center;
    }

    .link-card-header h3 {
        font-size: 1.15rem;
        font-weight: 600;
        margin: 0;
        color: #2c3e50;
        line-height: 1.3;
    }

    .link-card-desc {
        font-size: 0.95rem;
        color: #7f8c8d;
        line-height: 1.6;
        margin: 0;
    }

    @media (max-width: 768px) {
        .link-nav {
            padding: 1rem;
            margin: 1rem;
        }
        .link-nav h1 {
            font-size: 2rem;
        }
        .link-grid {
            grid-template-columns: 1fr;
        }
    }
</style>

<div class="link-nav">
    <h1>{{ page.title }}</h1>
    <p class="subtitle">这里收集了一些我常用的或推荐的网站链接。</p>

    {% for group in site.data.links %}
    <div class="link-category">
        <div class="link-category-header">
            <i class="fas {{ group.icon | default: 'fa-link' }}"></i>
            <h2>{{ group.category }}</h2>
        </div>
        <div class="link-grid">
            {% for link in group.links %}
            <div class="link-card">
                <a href="{{ link.url }}" target="_blank" rel="noopener noreferrer">
                    <div class="link-card-header">
                        <i class="fas {{ link.icon | default: 'fa-external-link-alt' }}"></i>
                        <h3>{{ link.name }}</h3>
                    </div>
                    <p class="link-card-desc">{{ link.desc }}</p>
                </a>
            </div>
            {% endfor %}
        </div>
    </div>
    {% endfor %}
</div>

<!-- 引入 Font Awesome（如果主题未包含） -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

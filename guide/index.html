---
layout: default
title: 网址导航
permalink: /guide/
icon: fa-link
---


<style>
    .link-nav {
        max-width: 1200px;
        margin: 3rem auto;
        padding: 0 1.5rem;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    .link-nav h1 {
        text-align: center;
        font-size: 2.2rem;
        font-weight: 700;
        color: #2c3e50;
        margin-bottom: 0.5rem;
        background: linear-gradient(90deg, #1a288b, #2b7085);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
    }

    .link-nav .subtitle {
        text-align: center;
        color: #7f8c8d;
        font-size: 1rem;
        margin-bottom: 2.5rem;
    }

    .link-category {
        margin-bottom: 2.5rem;
    }

    .link-category-header {
        display: flex;
        align-items: center;
        gap: 0.5rem;
        margin-bottom: 1rem;
    }

    .link-category-header i {
        font-size: 1.3rem;
        color: #3498db;
    }

    .link-category-header h2 {
        font-size: 1.3rem;
        font-weight: 600;
        color: #2c3e50;
        margin: 0;
    }

    .link-grid {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 1rem;
    }

    .link-card {
        background: #ffffff;
        border: 1px solid #eaeaea;
        border-radius: 10px;
        padding: 1rem;
        display: flex;
        align-items: flex-start;
        gap: 0.8rem;
        transition: background-color 0.2s ease;
        cursor: pointer;
        box-shadow: 0 2px 6px rgba(0,0,0,0.03);
    }

    .link-card:hover {
        background-color: #f8f9fa; /* 悬停浅灰底色 */
        border-color: #d1d9e0;
    }

    .link-card:hover .link-title {
        color: #e74c3c; /* 悬停标题变红 */
    }

    /* 调整图标大小 */
    .link-icon {
        font-size: 1.2rem; /* 将字体大小从1.4rem减小到1.2rem */
        color: #5d6d7e;
        min-width: 16px; /* 减少最小宽度以适应新的图标大小 */
        text-align: center;
        margin-top: 1px;
    }

    /* 添加随机颜色至图标 */
    .link-card .link-icon {
        color: var(--icon-color, #5d6d7e); /* 默认颜色 */
    }

    /* 为每个链接卡片生成一个随机但协调的颜色 */
    :root {
        --color-1: #3498db; /* 示例颜色，可以更换为你喜欢的协调颜色 */
        --color-2: #e74c3c;
        --color-3: #f39c12;
        --color-4: #2ecc71;
        --color-5: #8e44ad;
    }

    .link-card:nth-child(5n+1) .link-icon { --icon-color: var(--color-1); }
    .link-card:nth-child(5n+2) .link-icon { --icon-color: var(--color-2); }
    .link-card:nth-child(5n+3) .link-icon { --icon-color: var(--color-3); }
    .link-card:nth-child(5n+4) .link-icon { --icon-color: var(--color-4); }
    .link-card:nth-child(5n+5) .link-icon { --icon-color: var(--color-5); }

    /* 悬停时图标变红 */
    .link-card:hover .link-icon {
        color: #e74c3c;
    }

    .link-content {
        flex: 1;
        min-width: 0; /* 防止内容挤压图标 */
    }

    .link-title {
        font-size: 0.95rem;
        font-weight: 600;
        color: #2c3e50;
        margin: 0 0 0.4rem 0;
        line-height: 1.4;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        transition: color 0.2s ease;
    }

    .link-desc {
        font-size: 0.85rem;
        color: #7f8c8d;
        line-height: 1.5;
        margin: 0;
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
        overflow: hidden;
        text-overflow: ellipsis;
    }

    /* 响应式：平板3列，手机2列 → 1列 */
    @media (max-width: 992px) {
        .link-grid {
            grid-template-columns: repeat(3, 1fr);
        }
    }

    @media (max-width: 768px) {
        .link-grid {
            grid-template-columns: repeat(2, 1fr);
        }
        .link-nav {
            padding: 0 1rem;
        }
    }

    @media (max-width: 576px) {
        .link-grid {
            grid-template-columns: 1fr;
        }
        .link-nav h1 {
            font-size: 1.8rem;
        }
    }
</style>

<div class="link-nav">
    <h1>{{ page.title }}</h1>
    <p class="subtitle">这里收集了一些我常用的或推荐的网站链接。</p>

    {% for group in site.data.links %}
    <div class="link-category">
        <div class="link-category-header">
            <i class="fas {{ group.icon | default: 'fa-link' }}"></i>
            <h2>{{ group.category }}</h2>
        </div>
        <div class="link-grid">
            {% for link in group.links %}
            <a href="{{ link.url }}" target="_blank" rel="noopener noreferrer" class="link-card">
                <i class="fas link-icon {{ link.icon | default: 'fa-link' }}"></i>
                <div class="link-content">
                    <div class="link-title">{{ link.name }}</div>
                    <div class="link-desc">{{ link.desc }}</div>
                </div>
            </a>
            {% endfor %}
        </div>
    </div>
    {% endfor %}
</div>

<!-- 引入 Font Awesome（如果主题未包含） -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
